# Pull-request CI: compile and run the test suite (`mvnw verify`).
# Added by hugmesh-generator#954: this repo had no workflow that runs on a pull request, so a PR could
# merge on review alone onto a main that does not compile. The same job as hugmesh-forum-bff-api's `build`
# (that repo also runs its own guard scripts, a smoke test and a non-blocking SCA; none of those apply here).
#
# Advisory today: required status checks cannot be set on this plan (branch protection answers 403 until
# the plan changes), so a red check does not block a merge by itself. Read it before merging.
#
# GitHub-hosted `ubuntu-latest`, written literally: this runs on pull_request and the repository is public,
# so it must never name a self-hosted runner (a fork's PR runs the fork's copy of this file).
#
# Settings: the net.hugmesh libraries (parent, commons, auth-core) come from GitHub Packages through
# .github/maven-ci-settings.xml whenever the PACKAGES_READ_TOKEN org secret reaches the run (pushes to main and
# same-repo PRs). Without it (a fork PR) it falls back to the root settings.xml, which a hosted runner cannot
# reach, and the build fails to resolve the parent POM: a fork PR cannot run this green, and that is expected.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run is cancelled, so the check always reflects the latest commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test (mvnw verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (matches the GitLab CI eclipse-temurin:25 image)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build + test
        env:
          CI_JOB_TOKEN: ${{ secrets.GITLAB_MAVEN_TOKEN }}
          CI_API_V4_URL: ${{ secrets.GITLAB_API_V4_URL }}
          GITLAB_GROUP_ID: ${{ secrets.GITLAB_GROUP_ID }}
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          # Testcontainers suites talk to the host Docker daemon; the runner reaps its own containers.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          MAVEN_OPTS: "-Dapi.version=1.43"
        run: |
          set -euo pipefail
          settings=settings.xml
          if [ -n "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            settings=.github/maven-ci-settings.xml
          fi
          echo "maven settings: ${settings}"
          ./mvnw -B -s "${settings}" clean verify
