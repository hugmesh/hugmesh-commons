# Release: build/test hugmesh-commons and publish it to GitHub Packages (Maven registry).
# This repo had NO GitHub workflow at all until 2026-09-17 (hugmesh/hugmesh-commons#4),
# which made it the hard stop in the net.hugmesh publish chain: nothing downstream of it
# could be published because nothing could publish IT.
#
# WHAT STARTS A PUBLISH (beta scheme, 2026-10-21). A Maven coordinate is immutable, so a
# publish happens only when a person pushes a `v<version>` tag whose name equals the
# <version> in pom.xml (for example v2.2.0-beta.1). There is NO `push: branches` trigger:
# publish-on-merge would redeploy whatever pom.xml holds over a coordinate that is already
# out there, which is what forced hugmesh-auth-core's 2.4.2 re-pin.
#
#   push tag v<version>             -> version guard, verify, deploy, cosign keyless
#                                      signature + build-provenance attestation over the
#                                      published files, GitHub prerelease (+ SHA256SUMS)
#   workflow_dispatch on a v* tag   -> the same (the re-run path; the release step skips
#                                      itself if that GitHub Release already exists)
#   workflow_dispatch on main       -> version guard and verify only, nothing published
#   anything else                   -> the version guard refuses it
#
# RUNNER. Every job uses the same runs-on line. It picks vars.RUNS_ON_PUBLISH (a JSON
# array, for example ["self-hosted","Linux","X64"]) ONLY for a non-PR event on main or on
# a release tag, and the hosted ubuntu-latest runner for everything else. Deleting the
# RUNS_ON_PUBLISH variable is the off switch. This workflow has no pull_request trigger
# and must never get one. The runs-on line keeps OUR jobs off the local runner; it is not
# a security boundary against fork pull requests (a fork runs its own copy of the file).
# That boundary is the runner group's settings.
#
# A SELF-HOSTED RUNNER SHARES THE HOST'S HOME DIRECTORY. So nothing here writes to ~/.m2:
# setup-java writes its settings.xml under runner.temp (its default, ~/.m2/settings.xml,
# would overwrite the host's own file), there is no `cache: maven` (it restores an archive
# over ~/.m2/repository), every maven command uses a local repository under RUNNER_TEMP,
# and both maven steps set MAVEN_USER_HOME under runner.temp so that mvnw unpacks its
# Maven download there instead of ~/.m2/wrapper. The runner empties RUNNER_TEMP after
# each job.
#
# LINK 3 OF 4. The chain is
#   hugmesh-build-config 0.6.0-beta.1 -> hugmesh-parent 2.9.0-beta.1
#     -> hugmesh-commons 2.2.0-beta.1 -> hugmesh-auth-core 2.6.0-beta.1
# and each link is tagged and published in that order. See RELEASING.md here and
# hugmesh-auth-core/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.guard.outputs.version }}
      kind: ${{ steps.guard.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads <project><version>, never the <parent> version, by parsing the XML.
      - name: Read version from pom.xml
        id: pom
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys, xml.etree.ElementTree as ET; ns={"m": "http://maven.apache.org/POM/4.0.0"}; print(ET.parse("pom.xml").getroot().findtext("m:version", namespaces=ns).strip())')
          echo "pom.xml version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The decision. ReleasePublishGuardTest runs this exact script under bash with a
      # table of refs and versions, so keep it free of ${{ }} expressions: it reads only
      # VERSION, GITHUB_REF and GITHUB_OUTPUT.
      - name: Version guard
        id: guard
        env:
          VERSION: ${{ steps.pom.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::pom.xml version '${VERSION}' is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N. SNAPSHOT and other forms are never published."
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*)
              tag_version="${GITHUB_REF#refs/tags/v}"
              if [ "${tag_version}" != "${VERSION}" ]; then
                echo "::error::tag v${tag_version} does not match pom.xml version ${VERSION}. Fix the tag or the pom; nothing was published."
                exit 1
              fi
              kind=release
              ;;
            refs/heads/main)
              kind=main
              ;;
            *)
              echo "::error::${GITHUB_REF} is neither main nor a v<version> tag. Releases run from a v* tag; a dispatch on main only verifies."
              exit 1
              ;;
          esac
          echo "kind=${kind} version=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
      # The two below exist only for the signing steps after the deploy:
      # id-token for the keyless cosign signature and the attestation's
      # Sigstore certificate, attestations to store the provenance on GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 — hugmesh-parent's <java.version>, which this artifact compiles against.
          java-version: "25"
          # setup-java's generated settings.xml is NOT what authenticates this build:
          # both mvn calls below pass `-s .github/maven-ci-settings.xml`, and `-s` REPLACES
          # the user settings file. The servers that matter live in that file.
          # settings-path keeps the generated file out of ~/.m2 (see the header).
          settings-path: ${{ runner.temp }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # PREFLIGHT - CROSS-REPO PACKAGE READ. This step exists to stop ONE specific
      # misdiagnosis, and that is worth a whole step.
      #
      # The maven steps below resolve net.hugmesh artifacts published from OTHER
      # repositories. secrets.GITHUB_TOKEN is scoped to THIS repository, and GitHub does not
      # hand it cross-repository package access automatically: the build must present a
      # token carrying read:packages, which is the PACKAGES_READ_TOKEN secret (a classic
      # PAT with read:packages; decision 90a = B). If it is not set, maven fails with
      #     Could not resolve net.hugmesh:hugmesh-parent:pom:2.9.0-beta.1
      # which is the SAME string this repo's RELEASING.md and the comments below teach a
      # reader to interpret as "the upstream is not published yet". A reader who believes
      # that goes and re-publishes an upstream that is already there, and hits the same wall.
      #
      # So: probe the registries first, with the exact credential maven is about to use, and
      # name the failure correctly. A 200 proves this runner can READ that upstream's Maven
      # registry. It does NOT prove the exact version pinned in pom.xml exists - maven says
      # that, accurately, one step later.
      #
      # NOT VERIFIED. No Actions job in this org has ever started (billing; RELEASING.md
      # 6.1), so this preflight has never run either.
      - name: Preflight - cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        run: |
          set -uo pipefail
          if [ "${HAS_PACKAGES_READ_TOKEN}" = "true" ]; then
            echo "read credential: secrets.PACKAGES_READ_TOKEN (operator-held PAT)"
          else
            echo "read credential: the automatic secrets.GITHUB_TOKEN (PACKAGES_READ_TOKEN is not set)."
            echo "That token is scoped to THIS repository and may not read the upstream packages."
            echo "Set the PACKAGES_READ_TOKEN secret (classic PAT, read:packages). If the probe"
            echo "below fails, it says so explicitly. RELEASING.md 6.2."
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished'. This runner's credential cannot read that repository's Maven registry. Fix: set the PACKAGES_READ_TOKEN repo secret (classic PAT, read:packages), or share the org secret of that name with this repository. See RELEASING.md 6.2."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). TWO causes look identical here, so do not guess: (a) nothing is published to that registry yet - publish that link first, chain order is build-config, parent, commons, auth-core; or (b) it IS published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything. See RELEASING.md 6.2."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified - do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      # -s .github/maven-ci-settings.xml is required. The effective repository list of
      # this project is Maven Central alone, and net.hugmesh:hugmesh-parent (this pom's
      # own <parent>) and net.hugmesh:hugmesh-build-config (the analysers' ruleset jar, on
      # the PMD/Checkstyle/SpotBugs PLUGIN classpaths) are both 404 there.
      # A <repositories> block in pom.xml is NOT the alternative: maven.pkg.github.com
      # answers 401 to an unauthenticated GET, so that would break every developer build and
      # hugmesh-generator/tests/stack/m2-bootstrap.sh.
      #
      # verify runs on every ref the version guard lets through, so a dispatch on main is a
      # real build-and-test of main with nothing published.
      - name: Build and test
        run: ./mvnw -B -ntp -s .github/maven-ci-settings.xml -Dmaven.repo.local="${RUNNER_TEMP}/m2-repository" verify
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-user-home
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo READS use their own credential - see the settings file header
          # and RELEASING.md 6.2. Falls back to GITHUB_TOKEN when PACKAGES_READ_TOKEN is
          # unset; the preflight step above reports that case.
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # TWO ARTIFACTS COME OUT OF THIS STEP, and the second one is easy to lose.
      # pom.xml binds maven-jar-plugin's `test-jar` goal (execution `shared-test-base`), so
      # `deploy` uploads hugmesh-commons-<version>.jar AND hugmesh-commons-<version>-tests.jar.
      # hugmesh-auth-core's test scope compiles against
      # net.hugmesh:hugmesh-commons:<version>:tests (PostgresTestSupport), so a publish without
      # the classifier breaks the NEXT link of the chain, and breaks it at test-compile
      # where it reads like an auth-core problem.
      #
      # `-DskipTests` is correct and `-Dmaven.test.skip=true` is NOT: skipTests skips test
      # EXECUTION and still compiles src/test, which is what the test-jar packages;
      # maven.test.skip skips compilation too and would publish an EMPTY tests classifier.
      # ReleasePublishGuardTest fails the build if that flag ever appears here.
      #
      # -DaltDeploymentRepository overrides hugmesh-parent's inherited
      # distributionManagement, whose URL is the literal, uninterpolated
      # ${env.CI_API_V4_URL}/projects/${env.CI_PROJECT_ID}/packages/maven anywhere outside
      # GitLab CI — wrong registry AND a server id ('gitlab-maven') nothing has credentials
      # for.
      #
      # Runs ONLY when the version guard said kind=release, which means the ref is a
      # v<version> tag equal to pom.xml's version.
      - name: Publish jar and tests classifier to GitHub Packages
        if: needs.version.outputs.kind == 'release'
        run: ./mvnw -B -ntp -s .github/maven-ci-settings.xml -Dmaven.repo.local="${RUNNER_TEMP}/m2-repository" deploy -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-user-home
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo READS use their own credential - see the settings file header
          # and RELEASING.md 6.2. Falls back to GITHUB_TOKEN when PACKAGES_READ_TOKEN is
          # unset; the preflight step above reports that case.
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      # --- signed-maven-20261028 ---
      # Everything below signs what the deploy step just published, from this
      # job, by content: the published files are copied under their GitHub
      # Packages file names, SHA256SUMS over them gets a cosign keyless
      # signature (Sigstore, GitHub OIDC) and every file gets a SLSA
      # build-provenance attestation stored by GitHub. SHA256SUMS and the
      # cosign bundle are attached to the GitHub Release, so a consumer can
      # check what the registry serves against a signed list. A run that
      # did not deploy (dispatch on main) signs nothing.
      - name: Collect the published files
        if: needs.version.outputs.kind == 'release'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release && mkdir release
          cp "target/hugmesh-commons-$VERSION.jar" release/
          cp "target/hugmesh-commons-$VERSION-tests.jar" release/
          cp pom.xml "release/hugmesh-commons-$VERSION.pom"
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        if: needs.version.outputs.kind == 'release'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS (cosign keyless, GitHub OIDC) and check the signature
        # Keyless: the certificate is issued to THIS workflow file at THIS tag by
        # GitHub's OIDC issuer and logged in Sigstore's public transparency log.
        # The check right after uses the identity a consumer would use.
        if: needs.version.outputs.kind == 'release'
        working-directory: release
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Attest build provenance for every published file
        if: needs.version.outputs.kind == 'release'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: release/*

      - name: Keep SHA256SUMS and its signature for the GitHub Release
        if: needs.version.outputs.kind == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-signature
          path: |
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 7


  # A GitHub Release for the tag, marked prerelease and never "latest" while the version
  # is a beta. Re-running on the same tag skips the create instead of failing.
  github-release:
    needs: [version, build-and-publish]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      - name: Fetch SHA256SUMS and its signature from the publish job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-signature
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving it as it is."
            exit 0
          fi
          flags=(--verify-tag --title "hugmesh-commons ${VERSION}" --notes "net.hugmesh:hugmesh-commons:${VERSION} and its tests classifier, published to GitHub Packages. SHA256SUMS lists the published files; SHA256SUMS.sigstore.json is its cosign keyless signature (identity https://github.com/hugmesh/hugmesh-commons/.github/workflows/release.yml@refs/tags/${TAG}, issuer https://token.actions.githubusercontent.com); each file also has a GitHub build-provenance attestation (gh attestation verify <file> --repo hugmesh/hugmesh-commons).")
          case "${VERSION}" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "${TAG}" "${flags[@]}" release/SHA256SUMS release/SHA256SUMS.sigstore.json
